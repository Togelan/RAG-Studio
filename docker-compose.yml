# RAG-Studio — Docker Compose Configuration
# Minimum RAM: 4 GB | Recommended RAM: 8 GB | CPU: 2 cores minimum
#
# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose logs -f

version: "3.9"

services:
  rag-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-studio:latest
    container_name: rag-studio
    # Start as root only long enough for the entrypoint to chown host bind
    # mounts, then it re-execs the application as ragstudio.
    user: "0:0"

    # Port mapping: host:container
    ports:
      - "8000:8000"

    volumes:
      # The single persistent application volume: Qdrant, models, logs, settings, and secrets.
      - ./rag-data:/app/data

    # Environment variables
    env_file:
      # Tests can substitute the checked-in safe template without reading a
      # developer's credentials; local runtime behavior still defaults to .env.
      - ${RAG_STUDIO_ENV_FILE:-.env}

    environment:
      - RAG_STUDIO_DATA_ROOT=/app/data
      - QDRANT_PATH=/app/data/qdrant_storage
      - RAG_STUDIO_LOGS_PATH=/app/data/logs
      - RAG_STUDIO_UI_MODE=${RAG_STUDIO_UI_MODE:-react}
      - RAG_STUDIO_REACT_DIST=/app/frontend/dist

    # Resource constraints (AC-008.7)
    # Minimum: 4 GB RAM, 2 CPUs
    mem_limit: 4g
    cpus: "2"

    # Restart policy
    restart: unless-stopped

    # Stop grace period for graceful shutdown (AC-008.9)
    stop_grace_period: 15s

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
