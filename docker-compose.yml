# RAG-Studio — Docker Compose Configuration
# Minimum RAM: 4 GB | Recommended RAM: 8 GB | CPU: 2 cores minimum
#
# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose logs -f

version: "3.9"

services:
  rag-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-studio:latest
    container_name: rag-studio
    # Start as root only long enough for the entrypoint to chown host bind
    # mounts, then it re-execs the application as ragstudio.
    user: "0:0"

    # Port mapping: host:container
    ports:
      - "8001:8000"

    # Volume mounts for data persistence (AC-008.1, AC-008.2)
    volumes:
      # The single persistent application volume: Qdrant, models, logs, settings, and secrets.
      - rag-studio-data:/app/data

    # Environment variables
    env_file:
      - .env

    environment:
      - RAG_STUDIO_DATA_ROOT=/app/data
      - QDRANT_PATH=/app/data/qdrant_storage
      - RAG_STUDIO_LOGS_PATH=/app/data/logs

    # Resource constraints (AC-008.7)
    # Minimum: 4 GB RAM, 2 CPUs
    mem_limit: 4g
    cpus: "2"

    # Restart policy
    restart: unless-stopped

    # Stop grace period for graceful shutdown (AC-008.9)
    stop_grace_period: 15s

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  rag-studio-data:
    name: rag-studio-data
    external: true
