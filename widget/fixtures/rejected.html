<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Rejected widget host</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; font: 16px/1.5 system-ui; }
      .notice { max-width: 32rem; border: 1px solid #374151; border-radius: 12px; padding: 24px; background: #1f2937; }
    </style>
  </head>
  <body>
    <main class="notice" role="status" aria-live="polite">
      <h1>Support chat</h1>
      <p id="widget-status">Loading support chat…</p>
    </main>
    <script>
      window.setTimeout(() => {
        const status = document.getElementById("widget-status")
        if (status && !customElements.get("rag-studio-widget")) {
          status.textContent = "Chat is unavailable. Please try again later."
        }
      }, 400)
    </script>
  </body>
</html>
