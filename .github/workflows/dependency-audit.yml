name: Dependency audit

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pip-audit in isolated mode
        run: python -m pip install --isolated pip-audit
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt
